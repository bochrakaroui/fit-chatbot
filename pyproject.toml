[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "form-fitness-coach"
version = "0.1.0"
description = "Safety-aware fitness dataset, training, retrieval, and chat application"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.9,<3",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
ml = [
  "accelerate>=1.2,<2",
  "bitsandbytes>=0.45,<1; platform_system != 'Windows'",
  "datasets>=3.2,<5",
  "huggingface-hub>=0.27,<2",
  "peft>=0.14,<1",
  "torch>=2.5,<3",
  "transformers>=4.48,<6",
  "trl>=0.15,<1",
]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.9,<1",
]

[project.scripts]
fit-chat = "fit_chatbot.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/fit_chatbot"]

[tool.pytest.ini_options]
addopts = "-q --disable-warnings --basetemp=.pytest-tmp"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
